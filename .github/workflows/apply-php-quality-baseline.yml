name: Apply PHP Quality Baseline

on:
  pull_request:
    paths:
      - .github/workflows/apply-php-quality-baseline.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/php-quality-baseline-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Normalize PHP and refresh sealed identity
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/Runtime/SealedProviderCatalogTest.php')
          text = path.read_text()
          replacements = [
              (
                  'self::assertStringContainsString( "\'native\' => static function", $runtime );',
                  'self::assertMatchesRegularExpression( "/\'native\'\\s*=>\\s*static function/", $runtime );',
              ),
              (
                  'self::assertStringContainsString( "\'release\' => static function", $runtime );',
                  'self::assertMatchesRegularExpression( "/\'release\'\\s*=>\\s*static function/", $runtime );',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected catalog assertion: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          set +e
          vendor/bin/phpcbf --standard=.phpcs.xml --report=summary
          phpcbf_status=$?
          set -e
          if [ "$phpcbf_status" -gt 1 ]; then exit "$phpcbf_status"; fi

          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          files = sorted(['bootstrap.php', 'runtime.php'] + [str(p) for p in Path('src').rglob('*.php')])
          payload = b''.join(
              f.encode() + b'\0' + hashlib.sha256(Path(f).read_bytes()).hexdigest().encode() + b'\n'
              for f in files
          )
          revision = hashlib.sha256(payload).hexdigest()
          path = Path('runtime-copy.json')
          data = json.loads(path.read_text())
          data['package_revision'] = revision
          path.write_text(json.dumps(data, indent=2) + '\n')
          print(f'Runtime revision: {revision}')
          PY

          composer lint:syntax
          composer analyze
          composer test:unit

          set +e
          composer lint:php
          phpcs_status=$?
          set -e
          echo "Residual PHPCS status: $phpcs_status"
      - name: Commit verified PHP baseline
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-php-quality-baseline.yml
          git add bootstrap.php runtime.php src tests scripts runtime-copy.json .github/workflows/apply-php-quality-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize PHP with project coding standards'
          git push origin HEAD:${GITHUB_HEAD_REF}
