name: Apply JavaScript formatting

on:
  push:
    branches: [chore/quality-tooling]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
      - name: Install JavaScript quality dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply Prettier
        shell: bash
        run: |
          set -euo pipefail
          pnpm format
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts tests eslint.config.mjs
          git commit -m 'style: apply JavaScript formatting'
          git push origin HEAD:chore/quality-tooling
