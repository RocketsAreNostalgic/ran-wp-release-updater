name: Phase 3 diagnostics

on:
  push:
    branches:
      - chore/phase3-quality-baseline
    paths:
      - .github/workflows/phase3-diagnostics.yml

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Inventory PHPUnit doc-comment metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -E '@(dataProvider|testWith|depends|group|requires|test)([[:space:]]|$)' tests || true

  php-85:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
