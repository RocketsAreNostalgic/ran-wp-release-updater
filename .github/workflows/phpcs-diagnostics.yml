name: PHPCS Diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/phpcs-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/php-quality-baseline-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Production PHPCS details
        shell: bash
        run: |
          vendor/bin/phpcs --standard=.phpcs.xml --report=full bootstrap.php runtime.php scripts/lint-php.php src || true
      - name: Test PHPCS sniff counts
        shell: bash
        run: |
          vendor/bin/phpcs --standard=.phpcs.xml --report=source tests || true
