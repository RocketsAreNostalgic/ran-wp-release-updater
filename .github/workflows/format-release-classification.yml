name: Temporary Release Classification Formatter

on:
  push:
    branches: [fix/release-classification-20]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/release-classification-20
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.7.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and retire helper
        shell: bash
        run: |
          set -euo pipefail
          pnpm format
          git rm .github/workflows/format-release-classification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts tests .github/workflows/release-classification.yml eslint.config.mjs
          git commit -m 'style: format lifecycle classifier changes'
          git push origin HEAD:fix/release-classification-20
