name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
      - name: Install JavaScript quality dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - run: composer check
      - run: pnpm check
      - name: Prove isolated MySQL CAS lifecycle
        shell: bash
        run: |
          set -euo pipefail
          command -v mysqld
          php -m | grep -Fx mysqli
          mysql_root="$GITHUB_WORKSPACE/.workspaces/mysql-cas"
          system_mysqld="$(command -v mysqld)"
          mysql_tools="$GITHUB_WORKSPACE/.workspaces/mysql-cas-tools"
          mkdir -p "$mysql_tools"
          mysqld_binary="$mysql_tools/mysqld"
          cp "$system_mysqld" "$mysqld_binary"
          cmp "$system_mysqld" "$mysqld_binary"
          mkdir -p "$mysql_root"
          chmod 700 "$mysql_root"
          export RAN_UPDATER_MYSQL_ROOT="$mysql_root"
          export RAN_UPDATER_MYSQLD_BIN="$mysqld_binary"
          php tests/Integration/real-mysql-cas-setup-failure-proof.php
          php tests/Integration/real-mysql-cas-proof.php
          if find "$mysql_root" -mindepth 1 -print -quit | grep -q .; then
            echo 'Isolated MySQL CAS proof left fixture files behind.' >&2
            exit 1
          fi

  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint:syntax
      - run: php vendor/bin/phpunit --configuration phpunit.xml tests/Runtime/WindowsPortabilityProofTest.php

  wordpress-installed-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.5', '7.1']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2, wp-cli:2.12.0
      - name: Run installed WordPress integration
        shell: bash
        run: |
          set -euo pipefail
          command -v composer
          wp_cli="$(command -v wp)"
          system_mysqld="$(command -v mysqld)"
          php -m | grep -Fx mysqli

          integration_root="$GITHUB_WORKSPACE/.workspaces/wordpress-integration"
          socket_root="$GITHUB_WORKSPACE/.workspaces/sock"
          php_tmp="$integration_root/php-tmp"
          wp_cache="$integration_root/wp-cli-cache"
          wp_root="$GITHUB_WORKSPACE/.workspaces/wordpress-${{ matrix.wordpress }}"
          mysql_tools="$GITHUB_WORKSPACE/.workspaces/wordpress-integration-tools"
          mysqld_binary="$mysql_tools/mysqld"
          php_ini="$integration_root/php-ini"
          mkdir -p "$integration_root" "$socket_root" "$php_tmp" "$wp_cache" "$mysql_tools" "$php_ini"
          chmod 700 "$integration_root" "$socket_root" "$php_tmp" "$wp_cache" "$mysql_tools" "$php_ini"
          printf 'sys_temp_dir = "%s"\n' "$php_tmp" > "$php_ini/99-ran-updater-integration.ini"
          php_scan_dir="$(php --ini | sed -n 's/^Scan for additional .ini files in: //p')"
          export PHP_INI_SCAN_DIR="$php_ini:$php_scan_dir"
          export WP_CLI_CACHE_DIR="$wp_cache"
          export TMPDIR="$php_tmp" TMP="$php_tmp" TEMP="$php_tmp"

          cp "$system_mysqld" "$mysqld_binary"
          cmp "$system_mysqld" "$mysqld_binary"
          php -d "sys_temp_dir=$php_tmp" "$wp_cli" core download --version=${{ matrix.wordpress }} --skip-content --path="$wp_root"
          composer install --no-interaction --prefer-dist
          export RAN_UPDATER_WP_ROOT="$wp_root"
          export RAN_UPDATER_WP_CLI="$wp_cli"
          export RAN_UPDATER_MYSQLD_BIN="$mysqld_binary"
          export RAN_UPDATER_INTEGRATION_ROOT="$integration_root"
          export RAN_UPDATER_SOCKET_ROOT="$socket_root"
          composer test:wordpress-integration
      - name: Upload redacted integration result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wordpress-installed-integration-${{ matrix.wordpress }}
          path: ${{ github.workspace }}/.workspaces/wordpress-integration/ran-wp-release-updater-result-*.json
          if-no-files-found: ignore
          retention-days: 7

  finish-phpcs-baseline:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/php-quality-baseline-v2'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Resolve remaining production findings
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected fragment in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'bootstrap.php',
              "\t\tforeach ( $files as $file ) {\n\t\t\t$hash = hash_file( 'sha256', $regular( $file ) ?: '' );\n\t\t\tif ( ! is_string( $hash ) ) {",
              "\t\tforeach ( $files as $file ) {\n\t\t\t$regularFile = $regular( $file );\n\t\t\tif ( ! is_string( $regularFile ) ) {\n\t\t\t\treturn null;\n\t\t\t}\n\t\t\t$hash = hash_file( 'sha256', $regularFile );\n\t\t\tif ( ! is_string( $hash ) ) {",
          )

          p = Path('runtime.php')
          text = p.read_text()
          old = "<?php\n\ndeclare(strict_types=1);\n\n/**\n * Selected-root production kernel.\n *\n * Composer autoload order cannot decide ownership when multiple physical\n * copies exist. The broker selects the root first; this entrypoint then loads\n * every lifecycle symbol from that root or fails closed if a loser already\n * defined one.\n */"
          new = "<?php\n\n/**\n * Selected-root production kernel.\n *\n * Composer autoload order cannot decide ownership when multiple physical\n * copies exist. The broker selects the root first; this entrypoint then loads\n * every lifecycle symbol from that root or fails closed if a loser already\n * defined one.\n */\n\ndeclare(strict_types=1);"
          if old not in text:
              raise SystemExit('runtime header shape changed unexpectedly')
          p.write_text(text.replace(old, new, 1))

          replace(
              'src/Runtime/ReleaseSource.php',
              "\tprivate function operate( string $method, array $arguments ): array {\n\t\tif ( null !== ( $failure = $this->readiness() ) ) {\n\t\t\treturn $failure;\n\t\t}",
              "\tprivate function operate( string $method, array $arguments ): array {\n\t\t$failure = $this->readiness();\n\t\tif ( null !== $failure ) {\n\t\t\treturn $failure;\n\t\t}",
          )

          replace(
              'src/Runtime/RequestBroker.php',
              "\t\tif ( 'runtime-copy.json' === basename( $copyFile ) && isset( $this->candidateRoots[ realpath( dirname( $copyFile ) ) ?: '' ] ) ) {\n\t\t\treturn true;\n\t\t}",
              "\t\t$candidateRoot = realpath( dirname( $copyFile ) );\n\t\tif ( 'runtime-copy.json' === basename( $copyFile ) && is_string( $candidateRoot ) && isset( $this->candidateRoots[ $candidateRoot ] ) ) {\n\t\t\treturn true;\n\t\t}",
          )
          replace(
              'src/Runtime/RequestBroker.php',
              "\t\t\tfn ( array $left, array $right ): int => $this->compare( $right['package_version'], $left['package_version'] )\n\t\t\t\t?: strcmp( $left['source_root'], $right['source_root'] )",
              "\t\t\tfunction ( array $left, array $right ): int {\n\t\t\t\t$comparison = $this->compare( $right['package_version'], $left['package_version'] );\n\t\t\t\treturn 0 !== $comparison ? $comparison : strcmp( $left['source_root'], $right['source_root'] );\n\t\t\t}",
          )
          replace(
              'src/Runtime/RequestBroker.php',
              "\t\t\t$comparison = strlen( $left['core'][ $index ] ) <=> strlen( $right['core'][ $index ] )\n\t\t\t\t?: strcmp( $left['core'][ $index ], $right['core'][ $index ] );",
              "\t\t\t$comparison = strlen( $left['core'][ $index ] ) <=> strlen( $right['core'][ $index ] );\n\t\t\tif ( 0 === $comparison ) {\n\t\t\t\t$comparison = strcmp( $left['core'][ $index ], $right['core'][ $index ] );\n\t\t\t}",
          )
          replace(
              'src/Runtime/RequestBroker.php',
              "\t\tif ( array() === $left['prerelease'] || array() === $right['prerelease'] ) {\n\t\t\treturn array() === $left['prerelease'] ? ( array() === $right['prerelease'] ? 0 : 1 ) : -1;\n\t\t}\n\t\tfor ( $index = 0; $index < max( count( $left['prerelease'] ), count( $right['prerelease'] ) ); ++$index ) {",
              "\t\tif ( array() === $left['prerelease'] || array() === $right['prerelease'] ) {\n\t\t\tif ( array() === $left['prerelease'] ) {\n\t\t\t\treturn array() === $right['prerelease'] ? 0 : 1;\n\t\t\t}\n\t\t\treturn -1;\n\t\t}\n\t\t$prereleaseLength = max( count( $left['prerelease'] ), count( $right['prerelease'] ) );\n\t\tfor ( $index = 0; $index < $prereleaseLength; ++$index ) {",
          )
          replace(
              'src/Runtime/RequestBroker.php',
              "\t\t\tif ( $aNumeric && $bNumeric ) {\n\t\t\t\treturn strlen( $a ) <=> strlen( $b ) ?: strcmp( $a, $b );\n\t\t\t}",
              "\t\t\tif ( $aNumeric && $bNumeric ) {\n\t\t\t\t$comparison = strlen( $a ) <=> strlen( $b );\n\t\t\t\treturn 0 !== $comparison ? $comparison : strcmp( $a, $b );\n\t\t\t}",
          )

          replace(
              'src/Provider/GitHub/GitHubReleaseService.php',
              "\t\t\t\t\treturn ReleaseVersion::compare( $right['version'], $left['version'] )\n\t\t\t\t\t?: strcmp( $left['release_identity'], $right['release_identity'] );",
              "\t\t\t\t\t$comparison = ReleaseVersion::compare( $right['version'], $left['version'] );\n\t\t\t\t\treturn 0 !== $comparison ? $comparison : strcmp( $left['release_identity'], $right['release_identity'] );",
          )
          replace(
              'src/Provider/GitHub/GitHubReleaseService.php',
              "\t\t\t} catch ( \\Throwable ) {\n\t\t\t\t// Preserve the primary failure and report the synchronous cleanup result.\n\t\t\t}",
              "\t\t\t} catch ( \\Throwable ) {\n\t\t\t\t// Preserve the primary failure and report the synchronous cleanup result.\n\t\t\t\t$clean = false;\n\t\t\t}",
          )
          PY

          set +e
          vendor/bin/phpcbf --standard=.phpcs.xml --report=summary
          phpcbf_status=$?
          set -e
          if [ "$phpcbf_status" -gt 1 ]; then
            exit "$phpcbf_status"
          fi

          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          files = sorted(['bootstrap.php', 'runtime.php'] + [str(p) for p in Path('src').rglob('*.php')])
          payload = b''.join(f.encode() + b'\0' + hashlib.sha256(Path(f).read_bytes()).hexdigest().encode() + b'\n' for f in files)
          revision = hashlib.sha256(payload).hexdigest()
          path = Path('runtime-copy.json')
          data = json.loads(path.read_text())
          data['package_revision'] = revision
          path.write_text(json.dumps(data, indent=2) + '\n')
          print(revision)
          PY

          composer lint:syntax
          composer lint:php
          composer analyze
          composer test:unit
          composer check:updater-support
      - name: Commit verified baseline changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin chore/quality-tooling:refs/remotes/origin/chore/quality-tooling
          git show origin/chore/quality-tooling:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/phpcs-diagnostics.yml
          git add bootstrap.php runtime.php src runtime-copy.json .github/workflows/ci.yml .github/workflows/phpcs-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finish PHP coding standards baseline'
          git push origin HEAD:${GITHUB_HEAD_REF}
