name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@788f783d2998994f7aab9691710911ed1bd762c9
    with:
      php-floor: '8.2'
      php-current: '8.5'
      php-extensions: zip, mysqli
      node-version: '24.11.0'

  javascript:
    name: JavaScript quality
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          cache: pnpm

      - name: Verify exact pnpm toolchain
        run: test "$(pnpm --version)" = '11.7.0'

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JavaScript quality contract
        run: pnpm check

  mysql-cas:
    name: MySQL CAS proof
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prove isolated MySQL CAS lifecycle
        shell: bash
        run: |
          set -euo pipefail
          command -v mysqld
          php -m | grep -Fx mysqli
          mysql_root="$GITHUB_WORKSPACE/.workspaces/mysql-cas"
          system_mysqld="$(command -v mysqld)"
          mysql_tools="$GITHUB_WORKSPACE/.workspaces/mysql-cas-tools"
          mkdir -p "$mysql_tools"
          mysqld_binary="$mysql_tools/mysqld"
          cp "$system_mysqld" "$mysqld_binary"
          cmp "$system_mysqld" "$mysqld_binary"
          mkdir -p "$mysql_root"
          chmod 700 "$mysql_root"
          export RAN_UPDATER_MYSQL_ROOT="$mysql_root"
          export RAN_UPDATER_MYSQLD_BIN="$mysqld_binary"
          php tests/Integration/real-mysql-cas-setup-failure-proof.php
          php tests/Integration/real-mysql-cas-proof.php
          if find "$mysql_root" -mindepth 1 -print -quit | grep -q .; then
            echo 'Isolated MySQL CAS proof left fixture files behind.' >&2
            exit 1
          fi

  windows-portability:
    name: Windows portability
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer lint:syntax
      - run: php vendor/bin/phpunit --configuration phpunit.xml tests/Runtime/WindowsPortabilityProofTest.php

  wordpress-installed-integration:
    name: WordPress ${{ matrix.wordpress }} installed integration
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.5', '7.1']
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2, wp-cli:2.12.0

      - name: Run installed WordPress integration
        shell: bash
        run: |
          set -euo pipefail
          command -v composer
          wp_cli="$(command -v wp)"
          system_mysqld="$(command -v mysqld)"
          php -m | grep -Fx mysqli

          integration_root="$GITHUB_WORKSPACE/.workspaces/wordpress-integration"
          socket_root="$GITHUB_WORKSPACE/.workspaces/sock"
          php_tmp="$integration_root/php-tmp"
          wp_cache="$integration_root/wp-cli-cache"
          wp_root="$GITHUB_WORKSPACE/.workspaces/wordpress-${{ matrix.wordpress }}"
          mysql_tools="$GITHUB_WORKSPACE/.workspaces/wordpress-integration-tools"
          mysqld_binary="$mysql_tools/mysqld"
          php_ini="$integration_root/php-ini"
          mkdir -p "$integration_root" "$socket_root" "$php_tmp" "$wp_cache" "$mysql_tools" "$php_ini"
          chmod 700 "$integration_root" "$socket_root" "$php_tmp" "$wp_cache" "$mysql_tools" "$php_ini"
          printf 'sys_temp_dir = "%s"\n' "$php_tmp" > "$php_ini/99-ran-updater-integration.ini"
          php_scan_dir="$(php --ini | sed -n 's/^Scan for additional .ini files in: //p')"
          export PHP_INI_SCAN_DIR="$php_ini:$php_scan_dir"
          export WP_CLI_CACHE_DIR="$wp_cache" # Download-only; the suite creates and removes its own per-run cache.
          export TMPDIR="$php_tmp" TMP="$php_tmp" TEMP="$php_tmp"

          cp "$system_mysqld" "$mysqld_binary"
          cmp "$system_mysqld" "$mysqld_binary"
          php -d "sys_temp_dir=$php_tmp" "$wp_cli" core download --version=${{ matrix.wordpress }} --skip-content --path="$wp_root"
          composer install --no-interaction --prefer-dist --no-progress
          export RAN_UPDATER_WP_ROOT="$wp_root"
          export RAN_UPDATER_WP_CLI="$wp_cli"
          export RAN_UPDATER_MYSQLD_BIN="$mysqld_binary"
          export RAN_UPDATER_INTEGRATION_ROOT="$integration_root"
          export RAN_UPDATER_SOCKET_ROOT="$socket_root"
          composer test:wordpress-integration

      - name: Upload redacted integration result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wordpress-installed-integration-${{ matrix.wordpress }}
          path: ${{ github.workspace }}/.workspaces/wordpress-integration/ran-wp-release-updater-result-*.json
          if-no-files-found: ignore
          retention-days: 7

  quality:
    if: ${{ always() }}
    needs:
      - baseline
      - javascript
      - mysql-cas
      - windows-portability
      - wordpress-installed-integration
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require all quality lanes
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          MYSQL_CAS_RESULT: ${{ needs.mysql-cas.result }}
          WINDOWS_RESULT: ${{ needs.windows-portability.result }}
          WORDPRESS_RESULT: ${{ needs.wordpress-installed-integration.result }}
        run: |
          printf 'baseline=%s\njavascript=%s\nmysql-cas=%s\nwindows=%s\nwordpress=%s\n' \
            "$BASELINE_RESULT" "$JAVASCRIPT_RESULT" "$MYSQL_CAS_RESULT" "$WINDOWS_RESULT" "$WORDPRESS_RESULT"
          test "$BASELINE_RESULT" = success
          test "$JAVASCRIPT_RESULT" = success
          test "$MYSQL_CAS_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$WORDPRESS_RESULT" = success
