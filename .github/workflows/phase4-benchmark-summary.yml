name: Phase 4 benchmark summary

on:
  push:
    branches:
      - refactor/phase4-architecture
    paths:
      - .github/workflows/phase4-benchmark-summary.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Capture concise benchmark summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .workspaces/php-tmp
          TMPDIR="$PWD/.workspaces/php-tmp" php -d sys_temp_dir="$PWD/.workspaces/php-tmp" tests/Performance/native-discovery-measure.php > /tmp/phase4-benchmark.json
          python3 <<'PY'
          import json, statistics
          data = json.load(open('/tmp/phase4-benchmark.json'))
          rows = data['measurements']
          totals = [sum(r[k] for k in ('bootstrap_ns','declaration_ns','activation_ns','operations_ns')) for r in rows]
          one = [r for r in rows if r['physical_copies'] == 1 and r['distinct_targets'] == 1]
          def total(r): return sum(r[k] for k in ('bootstrap_ns','declaration_ns','activation_ns','operations_ns'))
          picked = {r['scenario']: total(r) for r in one}
          print('PHASE4_BENCHMARK_SUMMARY=' + json.dumps({
            'runtime_php_files': data['source_inventory']['runtime_php_files'],
            'runtime_php_bytes': data['source_inventory']['runtime_php_bytes'],
            'rows': len(rows),
            'median_total_ns': int(statistics.median(totals)),
            'max_total_ns': max(totals),
            'one_copy_one_target_total_ns': picked,
          }, sort_keys=True))
          PY
