name: Phase 4 architecture assessment

on:
  push:
    branches:
      - refactor/phase4-architecture
    paths:
      - .github/workflows/phase4-assessment.yml

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Inventory large classes
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/WordPress/NativePluginUpdater.php \
            src/Provider/GitHub/GitHubReleaseService.php \
            src/Runtime/RequestBroker.php \
            src/WordPress/ReleaseOperationCoordinator.php; do
            echo "===== $file ====="
            wc -l "$file"
            grep -n -E '^[[:space:]]*(public|protected|private)[[:space:]]+(static[[:space:]]+)?function[[:space:]]+' "$file" || true
            echo
          done
      - name: Measure per-file PHPStan debt
        shell: bash
        run: |
          set +e
          for file in \
            src/WordPress/NativePluginUpdater.php \
            src/Provider/GitHub/GitHubReleaseService.php \
            src/Runtime/RequestBroker.php \
            src/WordPress/ReleaseOperationCoordinator.php; do
            echo "===== PHPStan $file ====="
            php vendor/bin/phpstan analyse "$file" --configuration=phpstan.neon --level=8 --no-progress --memory-limit=1G --error-format=raw
            echo "status=$?"
            echo
          done
          exit 0
      - name: Run native discovery performance fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .workspaces/php-tmp
          TMPDIR="$PWD/.workspaces/php-tmp" php -d sys_temp_dir="$PWD/.workspaces/php-tmp" tests/Performance/native-discovery-measure.php
