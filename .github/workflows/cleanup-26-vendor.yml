name: Clean #26 committed dependencies

on:
  push:
    branches:
      - refactor/native-archive-custody
    paths:
      - .github/workflows/cleanup-26-vendor.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/native-archive-custody
          fetch-depth: 0
      - name: Remove committed dependency trees
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -d vendor
          git rm -r vendor
          cp .gitignore.clean.tmp .gitignore
          rm .gitignore.clean.tmp .github/vendor-cleanup-note.tmp .github/workflows/cleanup-26-vendor.yml
          git add .gitignore .gitignore.clean.tmp .github/vendor-cleanup-note.tmp .github/workflows/cleanup-26-vendor.yml
          git commit -m 'fix(stack): remove committed dependency trees'
          git push origin HEAD:refactor/native-archive-custody
