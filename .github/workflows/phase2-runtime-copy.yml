name: Verify runtime copy selector extraction

on:
  push:
    branches:
      - refactor/runtime-copy-selector
    paths:
      - .github/workflows/phase2-runtime-copy.yml

permissions:
  contents: write

jobs:
  extract-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/runtime-copy-selector
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Extract selector boundary and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/phase2-transform.py
          set +e
          composer format:php
          phpcbf_status=$?
          set -e
          if [ "$phpcbf_status" -gt 1 ]; then
            exit "$phpcbf_status"
          fi
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json

          files = sorted(['bootstrap.php', 'runtime.php'] + [str(path) for path in Path('src').rglob('*.php')])
          payload = b''.join(
              path.encode() + b'\0' + hashlib.sha256(Path(path).read_bytes()).hexdigest().encode() + b'\n'
              for path in files
          )
          manifest = Path('runtime-copy.json')
          data = json.loads(manifest.read_text())
          data['package_revision'] = hashlib.sha256(payload).hexdigest()
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          print(data['package_revision'])
          PY
          composer check
      - name: Commit verified extraction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/phase2-transform.py .github/workflows/phase2-runtime-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Runtime/RuntimeCopySelector.php src/Runtime/RequestBroker.php tests/Runtime/RequestBrokerTest.php tests/Runtime/RequestBrokerActivationDrainTest.php runtime-copy.json .phpcs.xml phpstan.neon .github/phase2-transform.py .github/workflows/phase2-runtime-copy.yml
          git commit -m 'refactor(runtime): extract runtime copy selector'
          git push origin HEAD:refactor/runtime-copy-selector
