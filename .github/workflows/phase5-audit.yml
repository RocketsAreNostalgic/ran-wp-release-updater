name: Finalize Phase 5 hygiene

on:
  push:
    branches: [chore/phase5-repository-hygiene]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: chore/phase5-repository-hygiene
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2
      - name: Apply verified hygiene cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              '.gitattributes': [
                  ('/fixtures export-ignore\n', ''),
                  ('/.dex export-ignore\n', ''),
              ],
              'composer.json': [
                  ('"check:phase3": [', '"check:parity": ['),
              ],
              'tests/Provider/github-semantic-parity.json': [
                  ('"executable_gate": "composer check:phase3"', '"executable_gate": "composer check:parity"'),
              ],
              'tests/Provider/GitHubSemanticParityMatrixTest.php': [
                  ("self::assertSame( 'composer check:phase3', $matrix['executable_gate'] );", "self::assertSame( 'composer check:parity', $matrix['executable_gate'] );"),
              ],
              '.phpcs.xml': [
                  ('\t\t<exclude-pattern>/src/Provider/GitHub/GitHubApiClient.php</exclude-pattern>\n', ''),
                  ('\t\t<exclude-pattern>/src/Provider/GitHub/GitHubReleaseService.php</exclude-pattern>\n', ''),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  expected = 2 if filename == '.phpcs.xml' else 1
                  if count != expected and filename == '.phpcs.xml':
                      raise SystemExit(f'{filename}: expected {expected} occurrences of {old!r}, found {count}')
                  if filename != '.phpcs.xml' and count != 1:
                      raise SystemExit(f'{filename}: expected one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          rm -f .github/workflows/phase5-audit.yml

          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".gitattributes .github/workflows/phase5-audit.yml .phpcs.xml composer.json tests/Provider/GitHubSemanticParityMatrixTest.php tests/Provider/github-semantic-parity.json "
          ! git grep -n 'check:phase3' -- ':!.github/workflows/phase5-audit.yml'
          ! grep -qE '^/(\.dex|fixtures) export-ignore$' .gitattributes
          test "$(grep -c 'GitHubArtifactStore.php' .phpcs.xml)" -eq 2
          test "$(grep -c 'GitHubApiClient.php' .phpcs.xml || true)" -eq 0
          test "$(grep -c 'GitHubReleaseService.php' .phpcs.xml || true)" -eq 0

          composer install --no-interaction --prefer-dist
          composer check
          composer check:parity

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .gitattributes .phpcs.xml composer.json tests/Provider/GitHubSemanticParityMatrixTest.php tests/Provider/github-semantic-parity.json .github/workflows/phase5-audit.yml
          git diff --cached --check
          git commit -m 'chore: finish repository hygiene'
          git push origin HEAD:chore/phase5-repository-hygiene
