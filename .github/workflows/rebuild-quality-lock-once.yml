name: Rebuild quality lock once

on:
  push:
    branches:
      - chore/adopt-ran-quality-standards

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer update ran/coding-standards phpcompatibility/php-compatibility phpcompatibility/phpcompatibility-paragonie phpcompatibility/phpcompatibility-wp --with-dependencies --no-install --no-scripts --no-plugins --no-interaction
      - run: composer validate --strict --no-check-publish
      - run: grep -q '0b03e61a4bb558deeb6bc6b6399f44c0ec95e5be' composer.lock
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git rm .github/workflows/rebuild-quality-lock-once.yml
          git commit -m "chore: refresh shared quality lock"
          git push origin HEAD:chore/adopt-ran-quality-standards
