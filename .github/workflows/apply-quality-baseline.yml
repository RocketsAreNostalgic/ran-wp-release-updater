name: Apply Quality Baseline

on:
  pull_request:
    paths:
      - .github/workflows/apply-quality-baseline.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/php-quality-baseline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply mechanical formatters
        shell: bash
        run: |
          set -euo pipefail
          set +e
          vendor/bin/phpcbf --standard=.phpcs.xml --report=summary
          phpcbf_status=$?
          set -e
          if [ "$phpcbf_status" -gt 3 ]; then exit "$phpcbf_status"; fi
          pnpm format
          pnpm lint:js:fix
          pnpm format
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          files = sorted(['bootstrap.php', 'runtime.php'] + [str(p) for p in Path('src').rglob('*.php')])
          payload = b''.join(f.encode() + b'\0' + hashlib.sha256(Path(f).read_bytes()).hexdigest().encode() + b'\n' for f in files)
          revision = hashlib.sha256(payload).hexdigest()
          path = Path('runtime-copy.json')
          data = json.loads(path.read_text())
          data['package_revision'] = revision
          path.write_text(json.dumps(data, indent=2) + '\n')
          print(revision)
          PY
      - name: Commit mechanical baseline
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-quality-baseline.yml
          git add bootstrap.php runtime.php src tests scripts runtime-copy.json eslint.config.mjs .github/workflows/apply-quality-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize source with project quality standards'
          git push origin HEAD:${GITHUB_HEAD_REF}
