name: Apply Native Custody Refactor

on:
  pull_request:
    paths:
      - .github/workflows/apply-native-custody.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/native-archive-custody'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Extract custody collaborators
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json

          p = Path('src/WordPress/NativePluginUpdater.php')
          text = p.read_text()
          text = text.replace("\tprivate const MAX_MANIFEST_ENTRIES      = 10000;\n", "", 1)
          needle = "\tprivate int $discoveryEpoch       = 0;\n"
          insert = needle + "\tprivate OwnedArchiveStore $archiveStore;\n\tprivate StagedPackageManifest $manifestBuilder;\n"
          if needle not in text:
              raise SystemExit('missing updater property anchor')
          text = text.replace(needle, insert, 1)
          old = "\t\tprivate bool $nativeDiscoveryReuse = false\n\t) {}"
          new = "\t\tprivate bool $nativeDiscoveryReuse = false\n\t) {\n\t\t$this->archiveStore = new OwnedArchiveStore();\n\t\t$this->manifestBuilder = new StagedPackageManifest();\n\t}"
          if old not in text:
              raise SystemExit('missing updater constructor anchor')
          text = text.replace(old, new, 1)

          replacements = {
              "self::archiveIdentity( $owned['path'], $fresh )": "$this->archiveStore->identity( $owned['path'], $fresh )",
              "$this->removeOwnedArchive( $owned['path'], $owned['directory'] )": "$this->archiveStore->remove( $owned['path'], $owned['directory'] )",
              "$this->removeOwnedArchive( $this->pendingArchive, $this->ownedArchiveDirectory )": "$this->archiveStore->remove( $this->pendingArchive, $this->ownedArchiveDirectory )",
              "self::sameArchiveIdentity( $file, $this->descriptor, $this->pendingArchiveIdentity )": "$this->archiveStore->sameIdentity( $file, $this->descriptor, $this->pendingArchiveIdentity )",
              "self::regularFileManifest( $source )": "$this->manifestBuilder->build( $source )",
              "self::regularFileManifest( $destination )": "$this->manifestBuilder->build( $destination )",
              "self::manifestHash( $manifest )": "$this->manifestBuilder->hash( $manifest )",
              "self::manifestExpandedBytes( $manifest )": "$this->manifestBuilder->expandedBytes( $manifest )",
              "$proof->isValid() ? $this->copyOwnedArchive( $path ) : null": "$proof->isValid() ? $this->archiveStore->copy( $path, $descriptor ) : null",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing updater fragment: {old}')
              text = text.replace(old, new)

          start = text.index("\t/** @return array{directory:string,path:string}|null */ private function copyOwnedArchive")
          end = text.index("\tprivate static function validNativeIdentity", start)
          text = text[:start] + text[end:]

          start = text.index("\t/** @return array<string,int>|null */ private static function archiveIdentity")
          end = text.index("\t/** @param array<string,mixed> $value", start)
          text = text[:start] + text[end:]
          p.write_text(text)

          p = Path('runtime.php')
          text = p.read_text()
          anchor = "\t'RAN\\\\WPReleaseUpdater\\\\V1\\\\Contract\\\\AcquisitionReceipt' => 'src/Contract/AcquisitionReceipt.php',\n"
          insertion = anchor + "\t'RAN\\\\WPReleaseUpdater\\\\V1\\\\WordPress\\\\OwnedArchiveStore' => 'src/WordPress/OwnedArchiveStore.php',\n\t'RAN\\\\WPReleaseUpdater\\\\V1\\\\WordPress\\\\StagedPackageManifest' => 'src/WordPress/StagedPackageManifest.php',\n"
          if anchor not in text:
              raise SystemExit('missing runtime map anchor')
          p.write_text(text.replace(anchor, insertion, 1))

          p = Path('.phpcs.xml')
          text = p.read_text()
          for rule in ('WordPress.WP.AlternativeFunctions', 'WordPress.PHP.NoSilencedErrors'):
              start = text.index(f'<rule ref="{rule}">')
              anchor = '\t\t<exclude-pattern>/src/WordPress/NativePluginUpdater.php</exclude-pattern>'
              pos = text.index(anchor, start)
              addition = '\t\t<exclude-pattern>/src/WordPress/OwnedArchiveStore.php</exclude-pattern>\n\t\t<exclude-pattern>/src/WordPress/StagedPackageManifest.php</exclude-pattern>\n' + anchor
              text = text[:pos] + text[pos:].replace(anchor, addition, 1)
          p.write_text(text)

          p = Path('phpstan.neon')
          text = p.read_text()
          anchor = "\t\t- src/Contract\n"
          addition = anchor + "\t\t- src/WordPress/OwnedArchiveStore.php\n\t\t- src/WordPress/StagedPackageManifest.php\n"
          if anchor not in text:
              raise SystemExit('missing PHPStan path anchor')
          p.write_text(text.replace(anchor, addition, 1))

          files = sorted(['bootstrap.php', 'runtime.php'] + [str(path) for path in Path('src').rglob('*.php')])
          payload = b''.join(path.encode() + b'\0' + hashlib.sha256(Path(path).read_bytes()).hexdigest().encode() + b'\n' for path in files)
          revision = hashlib.sha256(payload).hexdigest()
          p = Path('runtime-copy.json')
          data = json.loads(p.read_text())
          data['package_revision'] = revision
          p.write_text(json.dumps(data, indent=2) + '\n')
          print(revision)
          PY
          set +e
          composer format:php
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          files = sorted(['bootstrap.php', 'runtime.php'] + [str(path) for path in Path('src').rglob('*.php')])
          payload = b''.join(path.encode() + b'\0' + hashlib.sha256(Path(path).read_bytes()).hexdigest().encode() + b'\n' for path in files)
          p = Path('runtime-copy.json')
          data = json.loads(p.read_text())
          data['package_revision'] = hashlib.sha256(payload).hexdigest()
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          composer check
      - name: Commit verified refactor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-native-custody.yml
          git add src/WordPress/NativePluginUpdater.php src/WordPress/OwnedArchiveStore.php src/WordPress/StagedPackageManifest.php runtime.php runtime-copy.json .phpcs.xml phpstan.neon .github/workflows/apply-native-custody.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refactor native archive custody'
          git push origin HEAD:${GITHUB_HEAD_REF}
