name: Trusted Release Classification

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-release-classification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-classification:
    name: Release classification (trusted)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Read live pull request identity
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RAN_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RAN_PR_NUMBER}")"
          base_ref="$(jq -er '.base.ref' <<<"$pr")"
          base_repo="$(jq -er '.base.repo.full_name' <<<"$pr")"
          base_repo_id="$(jq -er '.base.repo.id' <<<"$pr")"
          base_sha="$(jq -er '.base.sha' <<<"$pr")"
          head_sha="$(jq -er '.head.sha' <<<"$pr")"
          head_ref="$(jq -er '.head.ref' <<<"$pr")"
          head_repo="$(jq -er '.head.repo.full_name' <<<"$pr")"
          head_repo_id="$(jq -er '.head.repo.id' <<<"$pr")"
          author="$(jq -er '.user.login' <<<"$pr")"
          title="$(jq -er '.title' <<<"$pr")"
          pending_label="$(jq -r '[.labels[].name] | contains(["autorelease: pending"])' <<<"$pr")"
          tagged_label="$(jq -r '[.labels[].name] | contains(["autorelease: tagged"])' <<<"$pr")"
          test "$base_ref" = main
          test "$base_repo" = "$GITHUB_REPOSITORY"
          [[ "$base_repo_id" =~ ^[0-9]+$ ]]
          [[ "$head_repo_id" =~ ^[0-9]+$ ]]
          [[ "$base_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]]
          {
            echo "base_ref=$base_ref"
            echo "base_repo=$base_repo"
            echo "base_repo_id=$base_repo_id"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "head_ref=$head_ref"
            echo "head_repo=$head_repo"
            echo "head_repo_id=$head_repo_id"
            echo "author=$author"
            echo "title=$title"
            echo "pending_label=$pending_label"
            echo "tagged_label=$tagged_label"
          } >> "$GITHUB_OUTPUT"

      - name: Check out exact protected base revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.base_sha }}

      - name: Fetch exact pull request head as data
        env:
          RAN_PR_NUMBER: ${{ github.event.pull_request.number }}
          RAN_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${RAN_PR_NUMBER}/head:refs/remotes/origin/pr-head"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$RAN_HEAD_SHA"

      - name: Re-read live pull request identity
        env:
          GH_TOKEN: ${{ github.token }}
          RAN_PR_NUMBER: ${{ github.event.pull_request.number }}
          RAN_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          RAN_BASE_REPO: ${{ steps.pr.outputs.base_repo }}
          RAN_BASE_REPO_ID: ${{ steps.pr.outputs.base_repo_id }}
          RAN_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          RAN_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RAN_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          RAN_HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          RAN_HEAD_REPO_ID: ${{ steps.pr.outputs.head_repo_id }}
          RAN_PR_AUTHOR: ${{ steps.pr.outputs.author }}
          RAN_PR_TITLE: ${{ steps.pr.outputs.title }}
          RAN_PENDING_LABEL: ${{ steps.pr.outputs.pending_label }}
          RAN_TAGGED_LABEL: ${{ steps.pr.outputs.tagged_label }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RAN_PR_NUMBER}")"
          test "$(jq -er '.base.ref' <<<"$pr")" = "$RAN_BASE_REF"
          test "$RAN_BASE_REF" = main
          test "$(jq -er '.base.repo.full_name' <<<"$pr")" = "$RAN_BASE_REPO"
          test "$RAN_BASE_REPO" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.base.repo.id' <<<"$pr")" = "$RAN_BASE_REPO_ID"
          test "$(jq -er '.base.sha' <<<"$pr")" = "$RAN_BASE_SHA"
          test "$(jq -er '.head.sha' <<<"$pr")" = "$RAN_HEAD_SHA"
          test "$(jq -er '.head.ref' <<<"$pr")" = "$RAN_HEAD_REF"
          test "$(jq -er '.head.repo.full_name' <<<"$pr")" = "$RAN_HEAD_REPO"
          test "$(jq -er '.head.repo.id' <<<"$pr")" = "$RAN_HEAD_REPO_ID"
          test "$(jq -er '.user.login' <<<"$pr")" = "$RAN_PR_AUTHOR"
          test "$(jq -er '.title' <<<"$pr")" = "$RAN_PR_TITLE"
          test "$(jq -r '[.labels[].name] | contains(["autorelease: pending"])' <<<"$pr")" = "$RAN_PENDING_LABEL"
          test "$(jq -r '[.labels[].name] | contains(["autorelease: tagged"])' <<<"$pr")" = "$RAN_TAGGED_LABEL"

      - name: Set up Node for trusted classifier
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          check-latest: false

      - name: Classify exact live pull request
        env:
          RAN_RELEASE_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          RAN_RELEASE_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RAN_RELEASE_PR_TITLE: ${{ steps.pr.outputs.title }}
          RAN_RELEASE_PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          RAN_RELEASE_PR_HEAD_REPOSITORY: ${{ steps.pr.outputs.head_repo }}
          RAN_RELEASE_PR_HEAD_REPOSITORY_ID: ${{ steps.pr.outputs.head_repo_id }}
          RAN_RELEASE_PR_AUTHOR: ${{ steps.pr.outputs.author }}
          RAN_RELEASE_REPOSITORY: ${{ steps.pr.outputs.base_repo }}
          RAN_RELEASE_REPOSITORY_ID: ${{ steps.pr.outputs.base_repo_id }}
          RAN_RELEASE_PENDING_LABEL: ${{ steps.pr.outputs.pending_label }}
          RAN_RELEASE_TAGGED_LABEL: ${{ steps.pr.outputs.tagged_label }}
        run: node scripts/release-classification.mjs
