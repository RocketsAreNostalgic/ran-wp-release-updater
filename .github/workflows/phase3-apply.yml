name: Apply phase 3 quality baseline

on:
  push:
    branches:
      - chore/phase3-quality-baseline
    paths:
      - .github/workflows/phase3-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/phase3-quality-baseline
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Apply quality baseline and verify PHP 8.2
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/phase3-apply.py

          set +e
          composer format:php
          phpcbf_status=$?
          set -e
          if [ "$phpcbf_status" -gt 1 ]; then
            exit "$phpcbf_status"
          fi

          python3 <<'PY'
          from pathlib import Path
          import hashlib, json

          files = sorted(['bootstrap.php', 'runtime.php'] + [str(path) for path in Path('src').rglob('*.php')])
          payload = b''.join(
              path.encode() + b'\0' + hashlib.sha256(Path(path).read_bytes()).hexdigest().encode() + b'\n'
              for path in files
          )
          manifest = Path('runtime-copy.json')
          data = json.loads(manifest.read_text())
          data['package_revision'] = hashlib.sha256(payload).hexdigest()
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          print(data['package_revision'])
          PY

          composer check
          if grep -R -n '@dataProvider' tests; then
            echo 'Deprecated PHPUnit data-provider metadata remains.' >&2
            exit 1
          fi

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: zip, mysqli
          tools: composer:v2
      - name: Verify current stable PHP
        run: composer check
      - name: Commit verified phase 3 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm .github/phase3-apply.py .github/workflows/phase3-apply.yml .github/workflows/phase3-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'chore(quality): harden PHP compatibility baseline'
          git push origin HEAD:chore/phase3-quality-baseline
