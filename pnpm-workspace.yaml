packages:
  - '.'

overrides:
  'eslint-plugin-react-hooks>zod': ^4.6.6
  minimatch: 11.0.1

# pnpm 11 fails closed when a dependency has an undeclared install/build script.
# These transitive scripts are not required by this repository's lint/format tasks.
allowBuilds:
  core-js: false
  unrs-resolver: false

patchedDependencies:
  eslint-plugin-import@2.32.0: patches/eslint-plugin-import@2.32.0.patch
  eslint-plugin-jsx-a11y@6.10.2: patches/eslint-plugin-jsx-a11y@6.10.2.patch
  eslint-plugin-react@7.37.5: patches/eslint-plugin-react@7.37.5.patch
